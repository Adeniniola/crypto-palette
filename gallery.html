<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Gallery</title></head><body style="background:linear-gradient(180deg,#0b0320,#2b0b3a);color:#fff;font-family:Inter,arial;padding:1rem"><h1>Gallery</h1><div id="list"></div><script>function render(){ const list=JSON.parse(localStorage.getItem('palettes')||'[]'); const wrap=document.getElementById('list'); wrap.innerHTML=''; if(!list.length){ wrap.innerHTML='<p>No palettes yet.</p>'; return } list.forEach(p=>{ const el=document.createElement('div'); el.style.margin='8px 0'; el.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><div style="display:flex;width:200px;height:40px;overflow:hidden;border-radius:6px">${p.colors.map(c=>`<div style="flex:1;background:${c}"></div>`).join('')}</div><div style="margin-left:8px"><strong>${p.user}</strong><div class="small">${p.coin}</div></div><div style="margin-left:auto"><button onclick="vote('${p.id}')">👍 ${p.votes||0}</button></div></div>`; wrap.appendChild(el) }) } function vote(id){ const list=JSON.parse(localStorage.getItem('palettes')||'[]'); const p=list.find(x=>x.id===id); if(!p) return; p.votes=(p.votes||0)+1; localStorage.setItem('palettes',JSON.stringify(list)); render() } render();</script></body></html>
