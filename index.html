<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Crypto Palette</title>
<link rel="icon" href="assets/images/favicon.png" type="image/png"/>

<!-- Twitter/Open Graph (generic - updated per-share when possible) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@Crypto__Palette">
<meta property="og:site_name" content="Crypto Palette">
<meta property="og:image" content="https://adeniniola.github.io/crypto-palette/assets/images/share.png">

<style>
:root{--bg1:#0b0320;--bg2:#2b0b3a;--muted:#9aa0a6;--accent:#8a5cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#fff}
.container{max-width:980px;margin:4.5rem auto;padding:1rem}
.header{display:flex;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800}
.brand img{height:32px;border-radius:6px}
nav{margin-left:auto;display:flex;gap:.6rem;align-items:center}
nav a{color:var(--muted);text-decoration:none;padding:.4rem .7rem;border-radius:8px}
.card{background:rgba(255,255,255,0.03);padding:1rem;border-radius:12px;margin-top:1rem}
.controls{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
input,select,button{padding:.6rem;border-radius:8px;border:none;background:rgba(255,255,255,0.02);color:#fff}
button.primary{background:var(--accent);color:#fff;padding:.6rem .9rem;cursor:pointer;border:none}
.topCoins{display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap}
.coinCard{background:rgba(255,255,255,0.02);padding:.6rem;border-radius:8px;width:140px;text-align:center}
.palette{display:flex;flex-direction:column;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.03);position:relative;padding:8px}
.color{height:60px;display:flex;align-items:center;justify-content:center;font-weight:700;opacity:0;transform:translateY(12px);animation:fadeInUp .6s ease-out forwards}
.color:nth-child(1){animation-delay:.08s}
.color:nth-child(2){animation-delay:.16s}
.color:nth-child(3){animation-delay:.24s}
.color:nth-child(4){animation-delay:.32s}
.color:nth-child(5){animation-delay:.40s}
@keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}
.palette .hex{font-size:.8rem;padding-left:8px}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.ads-placeholder{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;margin-top:12px;color:var(--muted);text-align:center}
.footer{margin-top:2rem;color:var(--muted);font-size:0.9rem;text-align:center}
.site-watermark{position:fixed;bottom:12px;right:12px;color:var(--accent);opacity:0.75;font-weight:700;text-shadow:0 0 8px rgba(138,92,255,0.35);animation:floatPulse 3.8s ease-in-out infinite}
@keyframes floatPulse{0%{transform:translateY(0);opacity:.7}50%{transform:translateY(-3px);opacity:.95;text-shadow:0 0 12px rgba(138,92,255,0.6)}100%{transform:translateY(0);opacity:.7}}
@media(max-width:600px){.controls{flex-direction:column}input,select,button{width:100%}.coinCard{width:100%}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">
      <img src="assets/images/logo.png" alt="Crypto Palette logo">
      <div>Crypto Palette</div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="community.html">Community</a>
      <a href="games.html">Meme</a>
      <a href="resources.html">Resources</a>
    </nav>
  </div>

  <div class="card">
    <div class="controls">
      <input id="searchInput" placeholder="Search coin (name or symbol) — live suggestions"/>
      <select id="cryptoSelect"></select>
      <button id="generateBtn" class="primary">Generate</button>
    </div>

    <div class="topCoins" id="topCoins"></div>

    <div id="palette" class="palette" style="display:none"></div>

    <div class="actions">
      <button id="saveBtn" style="display:none">Save Palette</button>
      <button id="openMeme" style="display:none">Open Meme</button>
      <button id="shareBtn" style="display:none" class="primary">Share on X</button>
    </div>

    <div class="ads-placeholder">Ad placeholder — Google AdSense code goes here.</div>
  </div>

  <div class="footer">© Crypto Palette — ready for GitHub Pages deployment</div>
</div>

<div class="site-watermark">@Crypto__Palette</div>

<!-- hidden canvas used for optional local preview building if needed -->
<canvas id="shareCanvas" style="display:none"></canvas>

<script>
/* --------------------------
   Config
   -------------------------- */
const TENOR_KEY = "AIzaSyDnbLxq-UxWUGmAzPT1sGDAx_LbIxeYvI0"; // your Tenor key
const IMGUR_CLIENT_ID = "546c25e4e0f3b88"; // your Imgur client ID

/* --------------------------
   Helpers
   -------------------------- */
const $ = s => document.querySelector(s);
const $all = s => Array.from(document.querySelectorAll(s));

function hexContrastColor(hex){
  const h = hex.replace('#',''); const r = parseInt(h.substring(0,2),16); const g = parseInt(h.substring(2,4),16); const b = parseInt(h.substring(4,6),16);
  const yiq = (r*299 + g*587 + b*114)/1000;
  return yiq >= 128 ? '#000' : '#fff';
}

/* --------------------------
   Init coins + search
   -------------------------- */
async function initCoins(){
  try{
    const markets = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false').then(r=>r.json());
    const sel = $('#cryptoSelect'); sel.innerHTML='';
    markets.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=`${c.symbol.toUpperCase()} - ${c.name}`; sel.appendChild(o) });
    // quick top coins
    const topWrap = $('#topCoins'); topWrap.innerHTML='';
    const quick = ['bitcoin','ethereum','solana','binancecoin'];
    quick.forEach(id=>{
      const c = markets.find(x=>x.id===id);
      if(c){
        const el = document.createElement('div'); el.className='coinCard';
        el.innerHTML = `<div style="font-weight:700">${c.symbol.toUpperCase()}</div><div class="small">${c.name}</div><div style="margin-top:6px"><button data-id="${c.id}">Select</button></div>`;
        topWrap.appendChild(el);
      }
    });
    $all('.coinCard button').forEach(b=>b.addEventListener('click', e=>{
      $('#cryptoSelect').value = e.target.dataset.id;
      generatePalette();
    }));

    // search debounce
    let timer = null;
    $('#searchInput').addEventListener('input', e=>{
      const q = e.target.value.trim();
      if(timer) clearTimeout(timer);
      if(!q) return;
      timer = setTimeout(async ()=>{
        try{
          const s = await fetch('https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(q)).then(r=>r.json());
          if(s.coins && s.coins.length){
            const p = s.coins[0];
            if(!Array.from(sel.options).find(o=>o.value===p.id)) sel.prepend(new Option(p.symbol.toUpperCase()+' - '+p.name, p.id));
            sel.value = p.id;
          }
        }catch(err){console.error(err)}
      },150);
    });

  }catch(e){console.error('initCoins failed',e)}
}

/* --------------------------
   Palette logic
   -------------------------- */
async function fetchCoinFull(id){
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/coins/'+encodeURIComponent(id));
    if(!r.ok) throw new Error('CoinGecko error '+r.status);
    return await r.json();
  }catch(e){ console.error(e); return null }
}

function paletteFromChange(change){
  if(change===null||isNaN(change)) return ['#777','#999','#bbb','#ddd','#eee'];
  if(change>10) return ['#00ff66','#00cc66','#66ff99','#ccffdd','#f0fff4'];
  if(change>3) return ['#00ff00','#1ec94a','#57ff8c','#9ffdba','#eaffef'];
  if(change>0) return ['#33cc33','#66ff99','#99ffcc','#ccffee','#eafff0'];
  if(change<-10) return ['#ff3b3b','#ff6666','#ff8f8f','#ffcfcf','#ffecec'];
  if(change<-3) return ['#ff3333','#ff6666','#ff9999','#ffd6d6','#ffeeee'];
  if(change<0) return ['#cc3333','#ff6666','#ff9999','#ffdede','#ffeeef'];
  return ['#cccccc','#dddddd','#eeeeee','#f4f4f4','#fafafa'];
}

/* --------------------------
   Render palette on page
   -------------------------- */
async function generatePalette(){
  const id = $('#cryptoSelect').value || 'bitcoin';
  localStorage.setItem('selectedCoin', id);
  const coin = await fetchCoinFull(id);
  const change = coin?.market_data?.price_change_percentage_24h ?? null;
  const pal = paletteFromChange(change);
  const wrap = $('#palette'); wrap.innerHTML='';
  pal.forEach((c)=>{
    const d = document.createElement('div'); d.className='color'; d.style.background = c;
    d.textContent = c; d.style.color = hexContrastColor(c);
    wrap.appendChild(d);
  });
  // watermark inside palette
  const wm = document.createElement('div'); wm.className='wrap-watermark'; wm.style.cssText = 'position:absolute;right:10px;bottom:8px;color:var(--accent);opacity:.75;font-weight:600;font-size:.85rem;text-shadow:0 0 6px rgba(138,92,255,0.35)'; wm.textContent='@Crypto__Palette';
  wrap.appendChild(wm);
  wrap.style.display='flex';
  $('#saveBtn').style.display='inline-block';
  $('#openMeme').style.display='inline-block';
  $('#shareBtn').style.display='inline-block';
}

/* --------------------------
   Tenor helper
   -------------------------- */
async function fetchTenorGif(query){
  try{
    const url = `https://g.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=${TENOR_KEY}&limit=20`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Tenor error '+res.status);
    const js = await res.json();
    if(!js.results || !js.results.length) return null;
    const pick = js.results[Math.floor(Math.random()*js.results.length)];
    // choose the best available field
    const media = pick.media && pick.media[0];
    const gif = (media && media.gif && media.gif.url) || pick.url || null;
    return gif;
  }catch(e){console.error('fetchTenorGif',e); return null}
}

/* --------------------------
   Build combined image and upload to Imgur
   -------------------------- */
function hexToRgb(hex){ hex = hex.replace('#',''); if(hex.length===3) hex = hex.split('').map(c=>c+c).join(''); const bigint=parseInt(hex,16); return {r:(bigint>>16)&255,g:(bigint>>8)&255,b:bigint&255}; }

async function buildShareImage({gifUrl, coinName, coinSymbol, price, colors}){
  const width = 1000;
  const memeHeight = 560;
  const paletteHeight = 160;
  const height = memeHeight + paletteHeight;
  const canvas = document.getElementById('shareCanvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');

  // background
  const g = ctx.createLinearGradient(0,0,0,height); g.addColorStop(0,'#0b0320'); g.addColorStop(1,'#12072a'); ctx.fillStyle = g; ctx.fillRect(0,0,width,height);

  // try draw gif
  let drew = false;
  if(gifUrl){
    try{
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = gifUrl;
      await new Promise((res,rej)=>{ img.onload = res; img.onerror = rej; });
      const pad = 28;
      const w = width - pad*2; const h = memeHeight - pad*2;
      const sw = img.width, sh = img.height; const scale = Math.min(w/sw, h/sh);
      const dw = sw*scale, dh = sh*scale;
      ctx.drawImage(img, (width-dw)/2, pad + ((memeHeight-pad*2)-dh)/2, dw, dh);
      drew = true;
    }catch(err){
      console.warn('Gif draw failed (CORS?)',err);
      drew = false;
    }
  }
  if(!drew){
    ctx.fillStyle = '#06030a'; ctx.fillRect(40,40,width-80,memeHeight-80);
    ctx.fillStyle = '#9aa0a6'; ctx.font = '18px Inter, Arial'; ctx.textAlign = 'center';
    ctx.fillText('GIF preview unavailable — sharing palette image instead', width/2, memeHeight/2);
  }

  // heading box over meme
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(28,28,520,46);
  ctx.fillStyle = '#fff'; ctx.font = '700 20px Inter, Arial'; ctx.textAlign = 'left';
  const priceStr = (price && !isNaN(price)) ? ('$' + Number(price).toLocaleString()) : 'n/a';
  ctx.fillText(`${coinName} — ${coinSymbol.toUpperCase()} — ${priceStr}`, 40, 60);

  // palette horizontal strip
  const pad = 40; const paletteWidth = width - pad*2; const boxW = Math.floor(paletteWidth / colors.length) - 8; const boxH = 90;
  colors.forEach((hex,i)=>{
    const x = pad + i*(boxW + 8); const y = memeHeight + 18;
    ctx.fillStyle = hex; ctx.fillRect(x, y, boxW, boxH);
    // hex label
    ctx.font = '600 18px Inter, Arial'; ctx.fillStyle = ( (hexToRgb(hex).r*0.299 + hexToRgb(hex).g*0.587 + hexToRgb(hex).b*0.114) > 186 ? '#000' : '#fff');
    ctx.textAlign = 'center'; ctx.fillText(hex, x + boxW/2, y + boxH + 26);
  });

  // watermark
  ctx.font = '600 14px Inter, Arial'; ctx.fillStyle = 'rgba(138,92,255,0.9)'; ctx.textAlign = 'right'; ctx.fillText('@Crypto__Palette', width - 28, height - 18);

  return new Promise(res => canvas.toBlob(b => res({blob:b, drewGif:drew}), 'image/png'));
}

async function uploadToImgur(blob){
  if(!IMGUR_CLIENT_ID) throw new Error('Imgur client id not set');
  const form = new FormData(); form.append('image', blob);
  const r = await fetch('https://api.imgur.com/3/image', { method:'POST', headers:{ Authorization: 'Client-ID ' + IMGUR_CLIENT_ID }, body: form });
  const js = await r.json();
  if(js.success && js.data && js.data.link) return js.data.link;
  throw new Error('Imgur upload failed: ' + JSON.stringify(js));
}

/* --------------------------
   Share flow
   -------------------------- */
async function shareOnXFlow(){
  try{
    const id = localStorage.getItem('selectedCoin') || $('#cryptoSelect').value || 'bitcoin';
    const coin = await fetchCoinFull(id);
    const change = coin?.market_data?.price_change_percentage_24h ?? null;
    const price = coin?.market_data?.current_price?.usd ?? null;
    const colors = paletteFromChange(change);

    // pick tenor query
    let q = 'crypto meme';
    if(change!==null && !isNaN(change)){
      if(change>10) q='celebrate crypto';
      else if(change>3) q='happy crypto';
      else if(change>0) q='yay crypto';
      else if(change<-10) q='cry crypto';
      else if(change<-3) q='sad crypto';
      else if(change<0) q='shocked crypto';
    }

    const gifUrl = await fetchTenorGif(q);
    // build image
    const built = await buildShareImage({gifUrl, coinName: coin?.name||id, coinSymbol: coin?.symbol||'', price, colors});
    // upload
    const uploaded = await uploadToImgur(built.blob);
    // tweet
    const paletteText = colors.join(' | ');
    const tweet = `Check out this $${(coin?.symbol||id).toUpperCase()} color palette 🎨🔥\n${paletteText}\n#CryptoPalette @Crypto__Palette`;
    const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweet)}&url=${encodeURIComponent(uploaded)}`;
    window.open(tweetUrl, '_blank');
  }catch(err){
    console.error('shareOnXFlow error', err);
    alert('Sharing failed: ' + (err.message || err));
  }
}

/* --------------------------
   UI bindings
   -------------------------- */
$('#generateBtn').addEventListener('click', generatePalette);
$('#saveBtn').addEventListener('click', ()=>{
  const id = localStorage.getItem('selectedCoin')||'bitcoin';
  const colors = Array.from(document.querySelectorAll('#palette .color')).map(d=>d.textContent);
  const list = JSON.parse(localStorage.getItem('palettes')||'[]');
  const obj = { id:'p'+Date.now().toString(36), user: localStorage.getItem('username')||'guest', coin:id, colors, ts:Date.now() };
  list.unshift(obj); localStorage.setItem('palettes', JSON.stringify(list)); alert('Saved!');
});
$('#openMeme').addEventListener('click', ()=>location.href='games.html');
$('#shareBtn').addEventListener('click', shareOnXFlow);

/* init */
initCoins();
</script>
</body>
</html>
