<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Palette - Meme Section</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 1.8em;
      font-weight: bold;
      color: #a46cff;
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }

    input {
      background: #1a1a1a;
      color: white;
    }

    button {
      background: #a46cff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #c299ff;
    }

    .palette {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .color-box {
      width: 60px;
      height: 60px;
      margin: 5px;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .color-box:hover {
      transform: scale(1.1);
    }

    .meme-container {
      margin-top: 20px;
      animation: fadeIn 1.2s ease;
    }

    .meme-container img {
      max-width: 100%;
      border-radius: 10px;
    }

    .watermark {
      color: #a46cff;
      font-size: 0.9em;
      margin-top: 10px;
      opacity: 0.6;
      animation: fadeIn 1.5s ease;
    }
  </style>
</head>
<body>
  <header>Meme Palette 🎨</header>
  <div class="container">
    <input id="searchInput" placeholder="Search a coin e.g. Bitcoin" />
    <select id="coinSelect"></select>
    <button id="generateBtn">Generate Meme Palette</button>

    <div class="palette" id="palette"></div>
    <div class="meme-container" id="memeContainer"></div>

    <button id="shareBtn" style="display:none;">Share on X</button>
    <div class="watermark">@Crypto__Palette</div>
  </div>

  <script>
    const paletteEl = document.getElementById('palette');
    const memeEl = document.getElementById('memeContainer');
    const shareBtn = document.getElementById('shareBtn');
    const sel = document.getElementById('coinSelect');
    const clientId = '546c25e4e0f3b88'; // Imgur client ID

    // Fetch coins list
    async function initCoins() {
      const res = await fetch('https://api.coingecko.com/api/v3/coins/list');
      const data = await res.json();
      data.slice(0, 100).forEach(coin => {
        sel.add(new Option(coin.name, coin.id));
      });
    }

    initCoins();

    // Search suggestion
    let timer = null;
    document.getElementById('searchInput').addEventListener('input', e => {
      const q = e.target.value.trim();
      if (timer) clearTimeout(timer);
      if (!q) return;

      timer = setTimeout(async () => {
        try {
          const s = await fetch(
            'https://api.coingecko.com/api/v3/search?query=' + encodeURIComponent(q)
          ).then(r => r.json());
          if (s.coins && s.coins.length) {
            const p = s.coins[0];
            if (!Array.from(sel.options).find(o => o.value === p.id)) {
              sel.prepend(new Option(p.symbol.toUpperCase() + ' - ' + p.name, p.id));
            }
            sel.value = p.id;
          }
        } catch (err) {
          console.error(err);
        }
      }, 150);
    });

    // Generate Meme Palette
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const coinId = sel.value;
      if (!coinId) return alert('Please select a coin!');

      const colors = Array.from({ length: 4 }, () =>
        '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0')
      );

      paletteEl.innerHTML = '';
      colors.forEach(c => {
        const box = document.createElement('div');
        box.className = 'color-box';
        box.style.background = c;
        box.title = c;
        paletteEl.appendChild(box);
      });

      // Fetch random meme GIF from Tenor
      const memeRes = await fetch(`https://tenor.googleapis.com/v2/search?q=${coinId}&key=AIzaSyDnbLxq-UxWUGmAzPT1sGDAx_LbIxeYvI0&limit=1`);
      const memeData = await memeRes.json();
      const memeUrl = memeData.results[0]?.media_formats?.gif?.url || '';

      memeEl.innerHTML = `<img src="${memeUrl}" alt="Meme">`;

      shareBtn.style.display = 'block';
      shareBtn.onclick = () => {
        const text = `🎨 Coin: ${coinId}\nPalette: ${colors.join(', ')}\n#CryptoPalette`;
        const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(memeUrl)}`;
        window.open(shareUrl, '_blank');
      };
    });
  </script>
</body>
</html>
