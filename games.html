<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Palette | Games</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <meta name="description" content="Generate creative color palettes and GIFs, and share your favorite combinations on X." />
  <style>
    body {
      background-color: #0b0b0b;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      position: fixed;
      top: 0;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    header a {
      color: #b98aff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1em;
    }

    main {
      margin-top: 100px;
      text-align: center;
    }

    .palette {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      align-items: center;
    }

    .color-box {
      width: 180px;
      height: 50px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      transition: transform 0.3s ease;
    }

    .color-box:hover {
      transform: scale(1.05);
    }

    .gif-box {
      margin-top: 25px;
    }

    .gif-box img {
      width: 240px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(185, 138, 255, 0.3);
    }

    .share-btn {
      margin-top: 25px;
      background-color: #b98aff;
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .share-btn:hover {
      background-color: #8e63e0;
    }

    .watermark {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-size: 1.2em;
      font-weight: 700;
      color: rgba(185, 138, 255, 0.5);
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">← Back to Home</a>
    <h2>Crypto Palette</h2>
  </header>

  <main>
    <h1>🎨 Your Color Palette + GIF</h1>

    <div class="palette" id="palette"></div>
    <div class="gif-box" id="gifBox"></div>

    <button class="share-btn" id="shareBtn">Share on X</button>
  </main>

  <div class="watermark">Crypto__Palette</div>

  <script>
    // Example generated colors
    const colors = ['#FF4757', '#FFA502', '#2ED573', '#1E90FF', '#B98AFF'];
    const paletteContainer = document.getElementById('palette');

    colors.forEach(color => {
      const div = document.createElement('div');
      div.classList.add('color-box');
      div.style.backgroundColor = color;
      div.textContent = color;
      paletteContainer.appendChild(div);
    });

    // Example GIF from Tenor (you can replace the URL dynamically later)
    const gifBox = document.getElementById('gifBox');
    const gif = document.createElement('img');
    gif.src = 'https://media.tenor.com/zCwGkZbFhYIAAAAM/color-palette.gif';
    gif.alt = 'Palette GIF';
    gifBox.appendChild(gif);

    // Share on X
    const shareBtn = document.getElementById('shareBtn');
    shareBtn.addEventListener('click', () => {
      const text = encodeURIComponent("🎨 Check out my palette + GIF from #Crypto__Palette!");
      const url = encodeURIComponent("https://adeniniola.github.io/crypto-palette/");
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, "_blank");
    });
  </script>
</body>
</html>
