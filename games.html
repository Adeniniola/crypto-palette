<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Crypto Palette — Meme</title>
<style>
:root{--bg:#0b0320;--muted:#9aa0a6;--accent:#8a5cff}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,var(--bg),#2b0b3a);color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;align-items:center}
.brand{font-weight:800}
.container{max-width:980px;margin:2rem auto;padding:1rem}
.card{background:rgba(255,255,255,0.03);padding:1rem;border-radius:12px}
.meme{display:flex;flex-direction:column;gap:12px;align-items:center}
.meme img{max-width:720px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
.palettePreview{display:flex;width:420px;height:80px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.04)}
.palettePreview div{flex:1}
.controls{display:flex;gap:8px;align-items:center}
.small{color:var(--muted)}
.ads-placeholder{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header><div class="brand">Crypto Palette — Meme</div></header>
<div class="container">
  <div class="card">
    <div class="meme" id="memeArea">
      <div class="small">This shows a reaction GIF for the coin you selected on Home.</div>
      <div id="gifWrap"></div>
      <div id="info" class="small"></div>
      <div class="palettePreview" id="preview"></div>
      <div class="controls"><button id="regen">Generate Meme GIF</button><button id="share">Share to X (Twitter)</button></div>
      <div class="ads-placeholder">Ad placeholder — add AdSense code here.</div>
    </div>
  </div>
</div>
<script>
async function fetchChange(id){ try{ const r=await fetch('https://api.coingecko.com/api/v3/coins/'+encodeURIComponent(id)); const d=await r.json(); return d.market_data && d.market_data.price_change_percentage_24h }catch(e){console.error(e);return null} }
function paletteFromChange(change){ if(change===null||isNaN(change)) return ['#777','#999','#bbb','#ddd','#eee']; if(change>10) return ['#00ff66','#00cc66','#66ff99','#ccffdd','#f0fff4']; if(change>3) return ['#00ff00','#1ec94a','#57ff8c','#9ffdba','#eaffef']; if(change>0) return ['#33cc33','#66ff99','#99ffcc','#ccffee','#eafff0']; if(change<-10) return ['#ff3b3b','#ff6666','#ff8f8f','#ffcfcf','#ffecec']; if(change<-3) return ['#ff3333','#ff6666','#ff9999','#ffd6d6','#ffeeee']; if(change<0) return ['#cc3333','#ff6666','#ff9999','#ffdede','#ffeeef']; return ['#cccccc','#dddddd','#eeeeee','#f4f4f4','#fafafa'] }
async function getGifForChange(change){ let cat='neutral'; if(change>15) cat='celebrate'; else if(change>5) cat='happy'; else if(change>0) cat='yay'; else if(change<-10) cat='cry'; else if(change<-5) cat='sad'; else if(change<0) cat='shock'; try{ const r = await fetch('https://g.tenor.com/v1/search?q='+encodeURIComponent(cat+' crypto')+'&key=LIVDSRZULELA&limit=20'); const js = await r.json(); const arr = js.results || []; if(!arr.length) return ''; return arr[Math.floor(Math.random()*arr.length)].media[0].gif.url }catch(e){console.error(e);return ''} }
async function renderMeme(){ const coin = localStorage.getItem('selectedCoin')||'bitcoin'; const change = await fetchChange(coin); const pal = paletteFromChange(change); const gif = await getGifForChange(change); const gifWrap = document.getElementById('gifWrap'); gifWrap.innerHTML = gif ? '<img src="'+gif+'" alt="gif"/>' : '<div class="small">No GIF available</div>'; document.getElementById('info').textContent = coin.toUpperCase() + ' — 24h: ' + (change===null? 'n/a' : change.toFixed(2)+'%'); const prev = document.getElementById('preview'); prev.innerHTML=''; pal.forEach(c=>{ const d=document.createElement('div'); d.style.background=c; prev.appendChild(d) }) }
document.getElementById('regen').addEventListener('click', renderMeme); document.getElementById('share').addEventListener('click', ()=>{ const coin = localStorage.getItem('selectedCoin')||'bitcoin'; const info = document.getElementById('info').innerText; const colors = Array.from(document.querySelectorAll('#preview div')).map(d=>d.style.background).join(', '); const img = document.querySelector('#gifWrap img'); const imgUrl = img ? img.src : ''; const text = encodeURIComponent(info + ' — Palette: ' + colors); window.open('https://twitter.com/intent/tweet?text='+text+'&url='+encodeURIComponent(imgUrl),'_blank') }); renderMeme();
</script>
</body>
</html>
