<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Community</title></head><body style="background:linear-gradient(180deg,#0b0320,#2b0b3a);color:#fff;font-family:Inter,arial;padding:1rem"><h1>Community Leaderboard</h1><div id="leader"></div><script>function refresh(){ const list=JSON.parse(localStorage.getItem('palettes')||'[]'); list.sort((a,b)=>(b.votes||0)-(a.votes||0)); document.getElementById('leader').innerHTML = list.slice(0,50).map(p=>`<div style="background:#0b0b0b;padding:8px;margin-bottom:8px;border-radius:8px"><strong>${p.user}</strong> - ${p.coin} - 👍 ${p.votes||0}<div style="display:flex;margin-top:6px">${p.colors.map(c=>`<div style=\"width:36px;height:28px;background:${c};margin-right:4px;border-radius:3px"></div>`).join('')}</div></div>`).join('') } refresh();</script></body></html>
